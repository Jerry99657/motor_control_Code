; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; The VS Code toolbar Build/Upload buttons must always use the production
; Wi-Fi + BLE + UART firmware. The diagnostic image remains opt-in via
; `pio run -e gamepad_probe ...` and can no longer overwrite it implicitly.
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter =
    +<*>
    -<gamepad_probe.cpp>
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    links2004/WebSockets @ 2.7.3
    h2zero/NimBLE-Arduino @ 1.4.3
    # WiFi 和 WebServer 自带在 ESP32 Arduino 核心中，不需要额外写

; Standalone BLE/GATT diagnostic image for the Flydigi Direwolf 3.
; This environment deliberately excludes the production web-controller source.
[env:gamepad_probe]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter =
    -<*>
    +<gamepad_probe.cpp>
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino @ 1.4.3

